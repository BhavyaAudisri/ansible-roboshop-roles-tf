- name: app setup
  include_role:
    name: common
    tasks_from: app-setup

- name: maven setup
  include_role:
    name: common
    tasks_from: maven

- name: Install Python MySQL dependencies
  ansible.builtin.dnf:
    name:
      - python3-PyMySQL
      - mysql
      - MySQL-python
      - python3-pip
      - python3-devel
      - gcc
  state: present

- name: import data
  community.mysql.mysql_db:
    name: all
    login_user: "{{ MYSQL_ROOT_USER }}"
    login_password: "{{ MYSQL_ROOT_PASSWORD }}"
    login_host: "{{ MYSQL_HOST }}"
    state: import
    target: "{{ item }}"
  loop:
  - /app/db/schema.sql
  - /app/db/app-user.sql
  - /app/db/master-data.sql

- name: Systemd setup
  ansible.builtin.include_role:
    name: common
    tasks_from: systemd
